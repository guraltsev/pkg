# Package metadata follows the containing v0-git.l1 version directory.
name = "overleaf-sync"
version = "0-git"
localVersion = 1
only_portable = false

description = "Two-way synchronization for Overleaf projects."
homepage = "https://github.com/guraltsev/overleaf-sync"

[origin]
mode = "git"
url = "git@github.com:guraltsev/overleaf-sync.git"

[update]
allow_automatic_update = true

[update.payload]
mode = "git"

[[bin]]
name = "overleaf-sync.cmd"
content = '''
@echo off
call "$App\ols.cmd" --store-path "%USERPROFILE%\.olauth" %*
'''
