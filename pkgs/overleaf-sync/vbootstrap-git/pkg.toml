# Package metadata follows the containing vbootstrap-git version directory.
name = "overleaf-sync"
version = "bootstrap-git"
localVersion = 0
only_portable = false

description = "Two-way synchronization for Overleaf projects."
homepage = "https://github.com/guraltsev/overleaf-sync"

[origin]
mode = "git"
url = "git@github.com:guraltsev/overleaf-sync.git"

[update]

[update.payload]
mode = "git"

[[bin]]
name = "overleaf-sync"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\ols.cmd"]
