name = "vscode"
version = "bootstrap"
localVersion = 1
only_portable = false

description = "Visual Studio Code editor with debugging, tasks, and version-control integration."
homepage = "https://code.visualstudio.com/"

[update]
allow_automatic_update = true

[update.check]
mode = "module"
module = "pkg.local/check_update.py"
channel = "stable"

[update.payload]
mode = "zip"
ignore_checksum = true

[[shortcut]]
name = "VSCode"
targetPath = "$App\\Code.exe"
description = "Visual Studio Code"
