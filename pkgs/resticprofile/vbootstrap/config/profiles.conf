#:schema https://creativeprojects.github.io/resticprofile/jsonschema/config-1.json
# Replace every placeholder before using this profile. Keep this file out of
# source control once it contains credentials or a repository password.
version = "1"

[default]
repository = "s3:s3.us-east-1.amazonaws.com/your-restic-bucket"

[default.env]
AWS_ACCESS_KEY_ID = "REPLACE_WITH_AWS_ACCESS_KEY_ID"
AWS_SECRET_ACCESS_KEY = "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
# AWS_SESSION_TOKEN = "REPLACE_WITH_AWS_SESSION_TOKEN_IF_USING_TEMPORARY_CREDENTIALS"
RESTIC_PASSWORD = "REPLACE_WITH_A_LONG_RANDOM_REPOSITORY_PASSWORD"

# [default.backup]
# source = [ "{{ .Env.USERPROFILE }}/Documents" ]
