name = "SumatraPDF-portable"
version = "bootstrap"
localVersion = 1
only_portable = true
description = "PDF, eBook (epub, mobi), comic book (cbz/cbr), DjVu, XPS, CHM, image viewer for Windows. Fast, small, packed with features, customizable, free."
homepage = "https://www.sumatrapdfreader.org"

[update]

[update.check]
mode = "module"

[update.payload]
mode = "zip"
ignore_checksum = true

[[update.payload.rename]]
src = "SumatraPDF-${version}-64.exe"
dest = "SumatraPDF.exe"

[[shortcut]]
name = "SumatraPDF"
targetPath = "$App\\SumatraPDF.exe"

[[bin]]
name = "SumatraPDF"
target = "$App\\SumatraPDF.exe"
type = "gui"
