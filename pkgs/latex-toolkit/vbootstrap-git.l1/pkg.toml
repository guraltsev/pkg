target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\mdt_greek_latex2unicode.cmd"]

[[bin]]
name = "mdt_greek_unicode2latex"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\mdt_greek_unicode2latex.cmd"]

[[bin]]
