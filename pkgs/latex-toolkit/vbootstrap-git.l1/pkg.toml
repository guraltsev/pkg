# Package metadata follows the containing v0-git.l1 version directory.
name = "latex-toolkit"
version = "bootstrap-git"
localVersion = 1
only_portable = false

description = "Preservation-focused command-line transformations for LaTeX source."
homepage = "https://github.com/guraltsev/latex-toolkit"

[origin]
mode = "git"
url = "git@github.com:guraltsev/latex-toolkit.git"

[update]

[update.payload]
mode = "git"

[[bin]]
name = "lt_brace_args"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_brace_args.cmd"]

[[bin]]
name = "lt_eqnum_label"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_eqnum_label.cmd"]

[[bin]]
name = "lt_full_normalize"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_full_normalize.cmd"]

[[bin]]
name = "lt_greek_latex2unicode"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_greek_latex2unicode.cmd"]

[[bin]]
name = "lt_greek_unicode2latex"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_greek_unicode2latex.cmd"]

[[bin]]
name = "lt_math_dollar2latex"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_math_dollar2latex.cmd"]

[[bin]]
name = "lt_math_latex2dollar"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_math_latex2dollar.cmd"]

[[bin]]
name = "lt_sentence-per-line"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_sentence-per-line.cmd"]

[[bin]]
name = "lt_syntax_regularizer"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\lt_syntax_regularizer.cmd"]

[[bin]]
name = "mdt_brace_args"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\mdt_brace_args.cmd"]

[[bin]]
name = "mdt_full_normalize"
target = "%COMSPEC%"
arguments = ["/d", "/c", "$App\\src\\mdt_full_normalize.cmd"]

[[bin]]
