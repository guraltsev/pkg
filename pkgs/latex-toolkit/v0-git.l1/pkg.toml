'''

[[bin]]
name = "lt_greek_unicode2latex.cmd"
content = '''
@echo off
call "$App\src\lt_greek_unicode2latex.cmd" %*
'''

[[bin]]
name = "lt_math_dollar2latex.cmd"
content = '''
@echo off
