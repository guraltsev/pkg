name = "gupkg"
version = "0.1"
localVersion = 1
description = "The standalone gupkg package manager runtime"
homepage = "https://github.com/guraltsev/pkg"
payloadDirectory = "gupkg"

[[environment]]
Name = "GUPKG_HOME"
Value = "$VersionRoot\\gupkg"

[[bin]]
name = "gupkg"
target = "%COMSPEC%"
arguments = ["/d", "/s", "/c", "$VersionRoot\\gupkg\\gupkg.cmd"]
type = "console"
forward_args = true

[[bin]]
name = "gupkg-tui"
target = "%COMSPEC%"
arguments = ["/d", "/s", "/c", "$VersionRoot\\gupkg\\gupkg-tui.cmd"]
type = "console"
forward_args = true
