name = "gupkg"
version = "0.1"
localVersion = 1
description = "The standalone gupkg package manager runtime"
homepage = "https://github.com/guraltsev/pkg"
payloadDirectory = "gupkg"

[[environment]]
Name = "GUPKG_HOME"
Value = "$VersionRoot\\gupkg"

[[bin]]
name = "gupkg"
target = "$VersionRoot\\gupkg\\python\\python.exe"
arguments = ["-m", "gupkg"]
type = "console"
forward_args = true

[[bin]]
name = "gupkg-tui"
target = "$VersionRoot\\gupkg\\python\\python.exe"
arguments = ["-m", "gupkg", "tui"]
type = "console"
forward_args = true
