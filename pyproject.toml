[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gupkg"
version = "0.12.0"
description = "Install and maintain local Windows packages declared by pkg.toml"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["textual>=0.50"]

[project.scripts]
gupkg = "gupkg.gupkg:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gupkg*"]
