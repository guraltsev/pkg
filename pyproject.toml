[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gupkg"
dynamic = ["version"]
description = "Install and maintain local Windows packages declared by pkg.toml"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["textual>=0.50"]

[project.scripts]
gupkg = "gupkg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gupkg*"]

[tool.setuptools.dynamic]
version = { attr = "gupkg._version.__version__" }

[tool.setuptools.package-data]
gupkg = [
    "pkg.toml",
    "7zip/*.dll",
    "7zip/*.exe",
    "shim/*.exe",
    "shim/LICENSE-*",
    "shim/README-exe-shim.md",
]
